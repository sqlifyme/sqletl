[project]
name = "sqletl"
version = "0.1.0"
description = "Create ETL pipelines with SQL"
authors = [
    {"name" = "Maxime Bouroumeau-Fuseau", email = "maxime.bouroumeau@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyparsing~=3.1",
    "requests~=2.32",
    "jsonpath-ng~=1.6",
    "pandas~=2.2",
    "postgres-proto~=0.1",
    "psycopg[binary]~=3.1",
    "mysql-connector-python~=8.3",
    "s3fs~=2024.9",
    "fsspec~=2024.9",
    "pyarrow~=17.0",
    "openpyxl~=3.1",
    "rich>=14.1.0",
]

[project.scripts]
sqletl = "sqletl.cli:main"

[project.urls]
Repository = "https://github.com/sqlify/sqletl"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
postgres-proto = { path = "../postgres-proto/", editable = true }
